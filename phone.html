<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" id="manifestLink" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ConfComp">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#5e6ad2">
<title>Conf Companion — Phone</title>
<style>
  /* Design language: Linear (linear.app), via the design-md skill. As a full-size page
     (unlike the R1's 240px screen) this uses more of the source scale directly: real
     surface-lift cards, 12px radii, and the accent reserved for the wordmark, links, active
     states, and the primary CTA — not as a section-title color, which the source spec
     doesn't do either (card titles are plain ink). See ~/.claude/skills/design-md. */
  :root {
    --accent: #5e6ad2;
    --accent-hover: #828fff;
    --on-accent: #ffffff;
    --canvas: #010102;
    --surface-1: #0f1011;
    --surface-2: #141516;
    --hairline: #23252a;
    --hairline-strong: #34343a;
    --ink: #f7f8f8;
    --ink-muted: #8a8f98;
    --ink-tertiary: #62666d;
  }
  * { box-sizing:border-box; }
  html { background:var(--canvas); overscroll-behavior-y:none; }
  body { font-family:Inter,-apple-system,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--canvas); color:var(--ink); margin:0; max-width:560px; margin:0 auto;
    padding:0 0 80px; overscroll-behavior-y:none; min-height:100vh; -webkit-font-smoothing:antialiased; }
  header { position:sticky; top:0; z-index:5; background:var(--canvas); border-bottom:1px solid var(--hairline);
    padding:10px 14px; font-size:16px; font-weight:600; letter-spacing:-0.2px; display:flex; align-items:center; gap:8px; }
  #brandLabel { color:var(--accent); } /* the wordmark is the one place the accent lives as a "brand mark" */
  header .dot { width:9px; height:9px; border-radius:50%; background:#f33; }
  header .dot.live { background:#27a644; }
  header .pair { margin-left:auto; font-size:11px; color:#27a644; background:var(--surface-1); border:1px solid var(--hairline); border-radius:10px; padding:2px 8px; font-weight:normal; }
  section { background:var(--surface-1); border:1px solid var(--hairline); border-radius:12px; margin:12px; padding:16px; }
  h3 { font-size:15px; font-weight:600; letter-spacing:-0.3px; color:var(--ink); margin:0 0 10px; }
  .qr { background:#fff; border-radius:8px; padding:8px; display:inline-block; }
  .qr img { image-rendering:pixelated; display:block; }
  .link { font-size:11px; color:var(--accent); word-break:break-all; margin-top:6px; }
  .row { border-bottom:1px solid var(--hairline); padding:9px 4px; }
  .row.fav { background:#171a2b; }
  .row .top { display:flex; align-items:center; gap:8px; }
  .row .time { font-size:12px; color:var(--accent); font-weight:600; min-width:46px; }
  .row .title { flex:1; font-size:14px; }
  .row .star { font-size:18px; color:var(--ink-tertiary); }
  .row .star.on { color:var(--accent); }
  .row .detail { display:none; font-size:12px; color:var(--ink-muted); margin-top:6px; line-height:1.4; }
  .row .intel { display:none; }
  .row.open .detail, .row.open .intel { display:block; }
  .row .badge { font-size:14px; }
  .intel { margin-top:8px; padding-top:8px; border-top:1px dashed var(--hairline); font-size:12px; color:var(--ink-muted); line-height:1.4; }
  .intel-h { font-size:10px; letter-spacing:1px; color:var(--accent); margin-bottom:4px; }
  .intel ul { margin:4px 0 0 16px; padding:0; }
  .intel li { margin-bottom:2px; }
  .muted { color:var(--ink-tertiary); font-size:12px; }
  .btnrow { position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto; z-index:5;
    display:flex; gap:8px; padding:10px 12px; background:var(--canvas); border-top:1px solid var(--hairline); }
  .btnrow button { flex:1; padding:12px; border:none; border-radius:8px; font-weight:600; font-size:14px; }
  .b-edit { background:var(--accent); color:var(--on-accent); }
  .b-sync { background:var(--surface-2); color:var(--ink); border:1px solid var(--hairline); }
  .out { font-size:12px; color:#27a644; padding:0 4px; }
  .out.err { color:#f66; }
  a.back { display:block; text-align:center; font-size:12px; color:var(--accent); margin:4px 0 0; }
</style>
</head>
<body>
<header>
  <span class="dot" id="statusDot"></span> <span id="brandLabel">CONF COMPANION</span>
  <span class="pair" id="pairPill" style="display:none"></span>
</header>

<section id="secLi">
  <h3>LinkedIn — quick connect</h3>
  <div class="qr" id="liQR"></div>
  <div class="link" id="liLink"></div>
  <button onclick="copyLi()" style="margin-top:8px;padding:8px 14px;background:var(--surface-2);color:var(--ink);border:1px solid var(--hairline);border-radius:8px;font-size:13px">Copy link</button>
</section>

<section id="secLand">
  <h3 id="landHdr">Landing page</h3>
  <div class="qr" id="landQR"></div>
  <div class="link" id="landLink"></div>
</section>

<section id="secSched">
  <h3 id="schedHdr" style="cursor:pointer;display:flex;align-items:center;margin:0 0 8px">
    <span style="flex:1">Schedule <span id="schedCount" class="muted"></span></span>
    <span id="schedCaret">▾</span>
  </h3>
  <div id="schedList"></div>
  <a class="back" href="/setup" id="editSchedLink">edit / import schedule →</a>
</section>

<section id="secIntel">
  <h3>Your pitch / company</h3>
  <div id="intelText" class="muted">Not set — add your company site in setup.</div>
</section>

<section id="secPair">
  <h3>Pair this device to R1</h3>
  <div class="qr" id="pairQR"></div>
  <div class="link" id="pairLink"></div>
  <div class="muted" style="margin-top:6px">On the R1: tap Pair phone → scan this.</div>
</section>

<div class="btnrow">
  <button class="b-sync" onclick="syncPhone()">⟳ Sync</button>
  <button class="b-edit" onclick="editSetup()">✎ Edit</button>
</div>
<div class="out" id="outMsg" style="margin:0 14px 14px"></div>

<script src="/r1/qrcode.js"></script>
<script>
function $(id){ return document.getElementById(id); }
var DEV = new URLSearchParams(location.search).get('d') || localStorage.getItem('cc_dev') || '';
if (DEV){
  localStorage.setItem('cc_dev', DEV);
  if (!location.search.includes('d=')) history.replaceState(null,'', '/phone?d='+DEV);
  var pill = $('pairPill'); pill.style.display='inline'; pill.textContent = 'paired: '+DEV;
  $('manifestLink').href = '/manifest.json?d='+DEV;
  $('editSchedLink').href = '/setup?d='+DEV;
}
var cfg = { name:'', linkedin:'', landing:'', landingLabel:'', companySummary:'', sessions:[], favs:{} };
var favs = {};
// ---------- helpers ----------
function qr(el, data){
  el.innerHTML = '';
  try { var q = window.qrcode(0,'M'); q.addData(data); q.make(); el.innerHTML = q.createImgTag(4,6); }
  catch(e){ el.innerHTML = '<div style="color:#000;font-size:11px">QR error</div>'; }
}
function liDeepLink(raw){
  if (!raw) return '';
  return raw.replace(/\?.*/,'').replace(/\/+$/,'') + '?fromQR=1';
}
async function api(path, body){
  var sep = path.includes('?') ? '&' : '?';
  var url = DEV ? path + sep + 'd=' + encodeURIComponent(DEV) : path;
  if (body && DEV) body.d = DEV;
  var opts = body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {};
  var r;
  try { var ctl = new AbortController(); var t = setTimeout(function(){ ctl.abort(); }, 8000);
    r = await fetch(url, Object.assign({signal:ctl.signal}, opts)); clearTimeout(t);
  } catch(e){ r = await fetch(url, opts); }
  return r.json();
}
function backupLocal(c){ try { localStorage.setItem('cc_backup', JSON.stringify(Object.assign({}, c, { favs: favs }))); } catch(e){} }
async function restoreIfEmpty(c){
  var empty = !c.name && !c.linkedin && !(c.sessions||[]).length && !c.companySummary;
  if (!empty) return c;
  try { var b = JSON.parse(localStorage.getItem('cc_backup') || 'null');
    if (b && (b.name || b.linkedin || (b.sessions||[]).length)){ await api('/api/config', Object.assign({}, b)); return b; } } catch(e){}
  return c;
}
function out(msg, err){ var e=$('outMsg'); e.textContent=msg; e.className='out'+(err?' err':''); }
// ---------- render ----------
function applyBrand(){
  document.documentElement.style.setProperty('--accent', cfg.brandColor || '#5e6ad2');
  $('brandLabel').textContent = cfg.brandName || 'CONF COMPANION';
  var mc = document.querySelector('meta[name=theme-color]'); if (mc) mc.content = cfg.brandColor || '#5e6ad2';
}
function render(){
  applyBrand();
  // LinkedIn
  if (cfg.linkedin){ var link = liDeepLink(cfg.linkedin);
    qr($('liQR'), link); $('liLink').textContent = link; $('secLi').style.display='block';
  } else { $('secLi').style.display='none'; }
  // Landing
  if (cfg.landing){ qr($('landQR'), cfg.landing);
    $('landHdr').textContent = (cfg.landingLabel||'Landing page');
    $('landLink').textContent = cfg.landing; $('secLand').style.display='block';
  } else { $('secLand').style.display='none'; }
  // Intel
  if (cfg.companySummary){ $('intelText').textContent = cfg.companySummary; $('intelText').className=''; }
  else { $('intelText').textContent = 'Not set — add your company site in setup.'; $('intelText').className='muted'; }
  // Pair
  if (DEV){ var purl = location.origin + '/setup?d=' + DEV; qr($('pairQR'), purl); $('pairLink').textContent = purl; }
  renderSchedule();
}
function renderSchedule(){
  var L = $('schedList'); L.innerHTML = '';
  var ss = cfg.sessions || [];
  if (!ss.length){ L.innerHTML = '<div class="muted">No schedule yet — import the agenda URL in setup.</div>'; $('schedCount').textContent=''; return; }
  var favSs = ss.filter(function(s){ return favs[s.id]; });
  var rest = ss.filter(function(s){ return !favs[s.id]; });
  function divider(t){ var d=document.createElement('div'); d.style.cssText='font-size:10px;letter-spacing:1px;color:var(--accent);padding:6px 2px 3px'; d.textContent=t; L.appendChild(d); }
  function addRow(s){
    var row = document.createElement('div'); row.className='row'+(favs[s.id]?' fav':'');
    var iv = cfg.intel && cfg.intel[s.id];
    var det = s.desc ? '<div class="detail">'+esc(s.desc.slice(0,400))+'</div>' : (s.speaker?'<div class="detail">'+esc(s.speaker)+'</div>':'');
    if (iv) det += '<div class="intel">' +
      '<div class="intel-h">🧠 INTEL — from R1</div>' +
      (iv.who ? '<div><b>Who:</b> '+esc(iv.who)+'</div>' : '') +
      (iv.angle ? '<div><b>Angle:</b> '+esc(iv.angle)+'</div>' : '') +
      (Array.isArray(iv.openers) && iv.openers.length ? '<div><b>Openers:</b><ul>'+iv.openers.map(function(q){ return '<li>'+esc(q)+'</li>'; }).join('')+'</ul></div>' : '') +
      (iv.avoid ? '<div><b>Avoid:</b> '+esc(iv.avoid)+'</div>' : '') +
      '</div>';
    row.innerHTML = '<div class="top"><div class="time">'+esc(s.time.split(/[-–]/)[0].replace(/[APMapm\s]/g,'').slice(0,5)||'·')+'</div>'+
      '<div class="title">'+esc(s.title)+'</div>'+(iv?'<div class="badge" title="intel ready">🧠</div>':'')+'<div class="star'+(favs[s.id]?' on':'')+'">'+(favs[s.id]?'★':'☆')+'</div></div>'+det;
    row.querySelector('.star').addEventListener('click', function(e){ e.stopPropagation(); toggleFav(s.id); });
    row.addEventListener('click', function(){ row.classList.toggle('open'); });
    L.appendChild(row);
  }
  if (favSs.length) divider('★ FAVORITES');
  favSs.forEach(addRow);
  var lastDay = null;
  rest.forEach(function(s){ if (s.day && s.day !== lastDay){ lastDay=s.day; divider(s.day.toUpperCase().slice(0,30)); } addRow(s); });
  var fn = favSs.length; $('schedCount').textContent = ss.length + ' · ' + fn + '★';
}
function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
// ---------- schedule collapse (persisted — a long agenda otherwise pushes everything else down the page) ----------
var schedCollapsed = false;
try { schedCollapsed = localStorage.getItem('cc_sched_collapsed') === '1'; } catch(e){}
function applySchedCollapse(){
  $('schedList').style.display = schedCollapsed ? 'none' : '';
  $('schedCaret').textContent = schedCollapsed ? '▸' : '▾';
}
$('schedHdr').addEventListener('click', function(){
  schedCollapsed = !schedCollapsed;
  applySchedCollapse();
  try { localStorage.setItem('cc_sched_collapsed', schedCollapsed ? '1' : ''); } catch(e){}
});
applySchedCollapse();
function toggleFav(id){ favs[id] = !favs[id]; backupLocal(cfg); renderSchedule();
  api('/api/config', { favs: favs }).then(function(){ out('Favorite saved ✓ — syncs to R1.'); }).catch(function(){ out('Saved locally; will sync next time online.', 1); });
}
function copyLi(){ if (!cfg.linkedin) return; var link=liDeepLink(cfg.linkedin);
  navigator.clipboard.writeText(link).then(function(){ out('LinkedIn link copied ✓'); }).catch(function(){ out(link); }); }
function editSetup(){ location.href = '/setup' + (DEV?'?d='+DEV:''); }
async function syncPhone(){ out('Syncing…'); $('statusDot').classList.remove('live');
  try { var c = await api('/api/config'); c = await restoreIfEmpty(c);
    cfg = c; favs = c.favs || {}; backupLocal(c); $('statusDot').classList.add('live');
    render(); out('Synced ✓ — '+(c.sessions||[]).length+' sessions.');
  } catch(e){ out('Sync failed: '+e.message, 1); }
}
async function load(){ $('statusDot').classList.remove('live');
  try { var c = await api('/api/config'); c = await restoreIfEmpty(c);
    cfg = c; favs = c.favs || {}; backupLocal(c); $('statusDot').classList.add('live'); render();
  } catch(e){ render(); }
}
load();
</script>
</body>
</html>
