<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" id="manifestLink" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ConfComp">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#ff6600">
<title>Conf Companion — Phone</title>
<style>
  * { box-sizing:border-box; }
  body { font-family:Helvetica,Arial,sans-serif; background:#111; color:#eee; margin:0;
    max-width:560px; margin:0 auto; padding:0 0 80px; }
  header { position:sticky; top:0; z-index:5; background:#111; border-bottom:2px solid #f60;
    padding:10px 14px; font-size:16px; font-weight:bold; display:flex; align-items:center; gap:8px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#f33; }
  header .dot.live { background:#0c0; }
  header .pair { margin-left:auto; font-size:11px; color:#0c0; background:#052; border-radius:10px; padding:2px 8px; font-weight:normal; }
  section { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; margin:12px; padding:12px; }
  h3 { font-size:13px; color:#f60; margin:0 0 8px; }
  .qr { background:#fff; border-radius:8px; padding:8px; display:inline-block; }
  .qr img { image-rendering:pixelated; display:block; }
  .link { font-size:11px; color:#9cf; word-break:break-all; margin-top:6px; }
  .row { border-bottom:1px solid #262626; padding:9px 4px; }
  .row.fav { background:#221a08; }
  .row .top { display:flex; align-items:center; gap:8px; }
  .row .time { font-size:12px; color:#f60; font-weight:bold; min-width:46px; }
  .row .title { flex:1; font-size:14px; }
  .row .star { font-size:18px; color:#444; }
  .row .star.on { color:#f60; }
  .row .detail { display:none; font-size:12px; color:#aaa; margin-top:6px; line-height:1.4; }
  .row.open .detail { display:block; }
  .muted { color:#888; font-size:12px; }
  .btnrow { position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto;
    display:flex; gap:8px; padding:10px 12px; background:#0a0a0a; border-top:1px solid #2a2a2a; }
  .btnrow button { flex:1; padding:12px; border:none; border-radius:8px; font-weight:bold; font-size:14px; }
  .b-edit { background:#f60; color:#000; }
  .b-sync { background:#333; color:#fff; }
  .out { font-size:12px; color:#8f8; padding:0 4px; }
  .out.err { color:#f66; }
  a.back { display:block; text-align:center; font-size:12px; color:#f60; margin:4px 0 0; }
</style>
</head>
<body>
<header>
  <span class="dot" id="statusDot"></span> CONF COMPANION
  <span class="pair" id="pairPill" style="display:none"></span>
</header>

<section id="secLi">
  <h3>LinkedIn — quick connect</h3>
  <div class="qr" id="liQR"></div>
  <div class="link" id="liLink"></div>
  <button onclick="copyLi()" style="margin-top:8px;padding:8px 14px;background:#333;color:#fff;border:none;border-radius:6px;font-size:13px">Copy link</button>
</section>

<section id="secLand">
  <h3 id="landHdr">Landing page</h3>
  <div class="qr" id="landQR"></div>
  <div class="link" id="landLink"></div>
</section>

<section id="secSched">
  <h3>Schedule <span id="schedCount" class="muted"></span></h3>
  <div id="schedList"></div>
  <a class="back" href="/setup" id="editSchedLink">edit / import schedule →</a>
</section>

<section id="secIntel">
  <h3>Your pitch / company</h3>
  <div id="intelText" class="muted">Not set — add your company site in setup.</div>
</section>

<section id="secPair">
  <h3>Pair this device to R1</h3>
  <div class="qr" id="pairQR"></div>
  <div class="link" id="pairLink"></div>
  <div class="muted" style="margin-top:6px">On the R1: tap Pair phone → scan this.</div>
</section>

<div class="btnrow">
  <button class="b-sync" onclick="syncPhone()">⟳ Sync</button>
  <button class="b-edit" onclick="editSetup()">✎ Edit</button>
</div>
<div class="out" id="outMsg" style="margin:0 14px 14px"></div>

<script src="/r1/qrcode.js"></script>
<script>
function $(id){ return document.getElementById(id); }
var DEV = new URLSearchParams(location.search).get('d') || localStorage.getItem('cc_dev') || '';
if (DEV){
  localStorage.setItem('cc_dev', DEV);
  if (!location.search.includes('d=')) history.replaceState(null,'', '/phone?d='+DEV);
  var pill = $('pairPill'); pill.style.display='inline'; pill.textContent = 'paired: '+DEV;
  $('manifestLink').href = '/manifest.json?d='+DEV;
  $('editSchedLink').href = '/setup?d='+DEV;
}
var cfg = { name:'', linkedin:'', landing:'', landingLabel:'', companySummary:'', sessions:[], favs:{} };
var favs = {};
// ---------- helpers ----------
function qr(el, data){
  el.innerHTML = '';
  try { var q = window.qrcode(0,'M'); q.addData(data); q.make(); el.innerHTML = q.createImgTag(4,6); }
  catch(e){ el.innerHTML = '<div style="color:#000;font-size:11px">QR error</div>'; }
}
function liDeepLink(raw){
  if (!raw) return '';
  return raw.replace(/\?.*/,'').replace(/\/+$/,'') + '?fromQR=1';
}
async function api(path, body){
  var sep = path.includes('?') ? '&' : '?';
  var url = DEV ? path + sep + 'd=' + encodeURIComponent(DEV) : path;
  if (body && DEV) body.d = DEV;
  var opts = body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {};
  var r;
  try { var ctl = new AbortController(); var t = setTimeout(function(){ ctl.abort(); }, 8000);
    r = await fetch(url, Object.assign({signal:ctl.signal}, opts)); clearTimeout(t);
  } catch(e){ r = await fetch(url, opts); }
  return r.json();
}
function backupLocal(c){ try { localStorage.setItem('cc_backup', JSON.stringify(Object.assign({}, c, { favs: favs }))); } catch(e){} }
async function restoreIfEmpty(c){
  var empty = !c.name && !c.linkedin && !(c.sessions||[]).length && !c.companySummary;
  if (!empty) return c;
  try { var b = JSON.parse(localStorage.getItem('cc_backup') || 'null');
    if (b && (b.name || b.linkedin || (b.sessions||[]).length)){ await api('/api/config', Object.assign({}, b)); return b; } } catch(e){}
  return c;
}
function out(msg, err){ var e=$('outMsg'); e.textContent=msg; e.className='out'+(err?' err':''); }
// ---------- render ----------
function render(){
  // LinkedIn
  if (cfg.linkedin){ var link = liDeepLink(cfg.linkedin);
    qr($('liQR'), link); $('liLink').textContent = link; $('secLi').style.display='block';
  } else { $('secLi').style.display='none'; }
  // Landing
  if (cfg.landing){ qr($('landQR'), cfg.landing);
    $('landHdr').textContent = (cfg.landingLabel||'Landing page');
    $('landLink').textContent = cfg.landing; $('secLand').style.display='block';
  } else { $('secLand').style.display='none'; }
  // Intel
  if (cfg.companySummary){ $('intelText').textContent = cfg.companySummary; $('intelText').className=''; }
  else { $('intelText').textContent = 'Not set — add your company site in setup.'; $('intelText').className='muted'; }
  // Pair
  if (DEV){ var purl = location.origin + '/setup?d=' + DEV; qr($('pairQR'), purl); $('pairLink').textContent = purl; }
  renderSchedule();
}
function renderSchedule(){
  var L = $('schedList'); L.innerHTML = '';
  var ss = cfg.sessions || [];
  if (!ss.length){ L.innerHTML = '<div class="muted">No schedule yet — import the agenda URL in setup.</div>'; $('schedCount').textContent=''; return; }
  var favSs = ss.filter(function(s){ return favs[s.id]; });
  var rest = ss.filter(function(s){ return !favs[s.id]; });
  function divider(t){ var d=document.createElement('div'); d.style.cssText='font-size:10px;letter-spacing:1px;color:#f60;padding:6px 2px 3px'; d.textContent=t; L.appendChild(d); }
  function addRow(s){
    var row = document.createElement('div'); row.className='row'+(favs[s.id]?' fav':'');
    var det = s.desc ? '<div class="detail">'+esc(s.desc.slice(0,400))+'</div>' : (s.speaker?'<div class="detail">'+esc(s.speaker)+'</div>':'');
    row.innerHTML = '<div class="top"><div class="time">'+esc(s.time.split(/[-–]/)[0].replace(/[APMapm\s]/g,'').slice(0,5)||'·')+'</div>'+
      '<div class="title">'+esc(s.title)+'</div><div class="star'+(favs[s.id]?' on':'')+'">'+(favs[s.id]?'★':'☆')+'</div></div>'+det;
    row.querySelector('.star').addEventListener('click', function(e){ e.stopPropagation(); toggleFav(s.id); });
    row.addEventListener('click', function(){ row.classList.toggle('open'); });
    L.appendChild(row);
  }
  if (favSs.length) divider('★ FAVORITES');
  favSs.forEach(addRow);
  var lastDay = null;
  rest.forEach(function(s){ if (s.day && s.day !== lastDay){ lastDay=s.day; divider(s.day.toUpperCase().slice(0,30)); } addRow(s); });
  var fn = favSs.length; $('schedCount').textContent = ss.length + ' · ' + fn + '★';
}
function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function toggleFav(id){ favs[id] = !favs[id]; backupLocal(cfg); renderSchedule();
  api('/api/config', { favs: favs }).then(function(){ out('Favorite saved ✓ — syncs to R1.'); }).catch(function(){ out('Saved locally; will sync next time online.', 1); });
}
function copyLi(){ if (!cfg.linkedin) return; var link=liDeepLink(cfg.linkedin);
  navigator.clipboard.writeText(link).then(function(){ out('LinkedIn link copied ✓'); }).catch(function(){ out(link); }); }
function editSetup(){ location.href = '/setup' + (DEV?'?d='+DEV:''); }
async function syncPhone(){ out('Syncing…'); $('statusDot').classList.remove('live');
  try { var c = await api('/api/config'); c = await restoreIfEmpty(c);
    cfg = c; favs = c.favs || {}; backupLocal(c); $('statusDot').classList.add('live');
    render(); out('Synced ✓ — '+(c.sessions||[]).length+' sessions.');
  } catch(e){ out('Sync failed: '+e.message, 1); }
}
async function load(){ $('statusDot').classList.remove('live');
  try { var c = await api('/api/config'); c = await restoreIfEmpty(c);
    cfg = c; favs = c.favs || {}; backupLocal(c); $('statusDot').classList.add('live'); render();
  } catch(e){ render(); }
}
load();
</script>
</body>
</html>
