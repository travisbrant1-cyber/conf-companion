<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" id="manifestLink" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ConfComp">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#ff6600">
<title>Conf Companion — Setup</title>
<style>
  body { font-family:Helvetica,Arial,sans-serif; background:#111; color:#eee; max-width:520px;
    margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; color:#f60; }
  h2 { font-size:14px; margin:26px 0 8px; border-bottom:1px solid #333; padding-bottom:4px; }
  label { display:block; font-size:12px; color:#999; margin:10px 0 3px; }
  input { width:100%; padding:10px; border:1px solid #444; background:#000; color:#fff;
    border-radius:6px; font-size:14px; }
  button { margin-top:10px; padding:10px 18px; background:#f60; color:#000; border:none;
    border-radius:6px; font-weight:bold; font-size:14px; }
  button:disabled { opacity:.5; }
  .out { font-size:12px; color:#8f8; margin-top:8px; white-space:pre-wrap; }
  .out.err { color:#f66; }
  .sess { font-size:12px; padding:6px 8px; border-bottom:1px solid #222; }
  .sess b { color:#f60; }
  .banner { background:#222; border:1px solid #f60; border-radius:8px; padding:10px 12px;
    font-size:13px; margin:14px 0; }
  .banner b { color:#f60; }
  .pill { font-size:11px; color:#0c0; background:#052; border-radius:10px; padding:2px 8px; }
</style>
</head>
<body>
<h1>Conf Companion — Setup</h1>
<p style="font-size:13px;color:#888">Fill this in from your phone/PC. The R1 pulls it on Sync.
  <span class="pill" id="pairPill" style="display:none"></span></p>
<div class="banner" id="a2hs" style="display:none">
  📌 <b>Save this page:</b> add it to your home screen so your conference setup is one tap away.<br>
  <span style="color:#999;font-size:12px" id="a2hsHow"></span>
</div>

<h2>Networking</h2>
<label>Your name (shown on QR screen)</label><input id="name">
<label>LinkedIn profile URL</label><input id="linkedin" placeholder="www.linkedin.com/in/you">
<label>Landing page URL (optional)</label><input id="landing" placeholder="yourco.com/demo">
<label>Landing page label</label><input id="landingLabel" placeholder="Product demo">

<h2>Conference schedule</h2>
<label>Agenda page URL</label><input id="scheduleUrl" placeholder="conf.example.com/agenda">
<button onclick="importSchedule()" id="btnSched">Import schedule</button>
<div class="out" id="outSched"></div>
<div id="sessPreview"></div>

<h2>Your company (intel base)</h2>
<label>Company website URL</label><input id="companyUrl" placeholder="yourco.com">
<button onclick="scanCompany()" id="btnCo">Scan site</button>
<div class="out" id="outCo"></div>

<div style="border-top:2px solid #f60; margin-top:24px; padding-top:14px; display:flex; gap:10px;">
  <button onclick="saveAll()" style="flex:2">💾 Save all</button>
  <button onclick="syncPhone()" style="flex:1; background:#333; color:#fff">⟳ Sync</button>
</div>
<div class="out" id="outBasic" style="margin-top:8px"></div>

<script>
function $(id){ return document.getElementById(id); }
var DEV = new URLSearchParams(location.search).get('d') || localStorage.getItem('cc_dev') || '';
if (DEV){
  localStorage.setItem('cc_dev', DEV);
  if (!location.search.includes('d=')) history.replaceState(null,'', '/setup?d='+DEV);
  var pill = $('pairPill');
  pill.style.display='inline'; pill.textContent = 'paired: '+DEV;
  $('manifestLink').href = '/manifest.json?d='+DEV;
}
// ---------- URL normalization ----------
function normalizeUrl(v){
  v = (v||'').trim();
  if (!v) return '';
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  return v.replace(/\s+/g,'');
}
['linkedin','landing','scheduleUrl','companyUrl'].forEach(function(id){
  var el = $(id);
  if (el) el.addEventListener('blur', function(){ el.value = normalizeUrl(el.value); });
});
// Add-to-home-screen prompt
(function(){
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    var b = $('a2hs'); b.style.display='block';
    $('a2hsHow').innerHTML = '<button onclick="window.__a2hs()">Add to home screen</button>';
    window.__a2hs = function(){ deferred.prompt(); };
  });
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone){
    var b = $('a2hs'); b.style.display='block';
    $('a2hsHow').textContent = isIOS
      ? 'iPhone: tap Share ▸ Add to Home Screen.'
      : 'Android: menu ⋮ ▸ Add to Home screen.';
  }
})();
function out(id, msg, err){ var e=$(id); e.textContent=msg; e.className='out'+(err?' err':''); }
async function api(path, body){
  var sep = path.includes('?') ? '&' : '?';
  var url = DEV ? path + sep + 'd=' + encodeURIComponent(DEV) : path;
  if (body && DEV) body.d = DEV;
  var opts = body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {};
  var r;
  try {
    var ctl = new AbortController(); var t = setTimeout(function(){ ctl.abort(); }, 8000);
    r = await fetch(url, Object.assign({signal:ctl.signal}, opts)); clearTimeout(t);
  } catch(e){
    document.title = 'Waking server…';
    r = await fetch(url, opts);
    document.title = 'Conf Companion — Setup';
  }
  var j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
// Durable backup: mirror config in phone localStorage; re-push if server lost it (free-tier disk resets).
function backupLocal(c){ try { localStorage.setItem('cc_backup', JSON.stringify(c)); } catch(e){} }
async function restoreIfEmpty(c){
  var empty = !c.name && !c.linkedin && !(c.sessions||[]).length && !c.companySummary;
  if (!empty) return c;
  try {
    var b = JSON.parse(localStorage.getItem('cc_backup') || 'null');
    if (b && (b.name || b.linkedin || (b.sessions||[]).length)){
      await api('/api/config', Object.assign({}, b));
      out('outBasic', 'Server had reset — restored your saved setup from this phone ✓');
      return b;
    }
  } catch(e){}
  return c;
}
async function load(){
  try {
    var c = await api('/api/config');
    c = await restoreIfEmpty(c);
    backupLocal(c);
    ['name','linkedin','landing','landingLabel','scheduleUrl','companyUrl'].forEach(function(k){ if(c[k]) $(k).value = c[k]; });
    if ((c.sessions||[]).length) preview(c.sessions);
    if (c.companySummary) out('outCo', 'Company intel saved (' + c.companySummary.length + ' chars).');
  } catch(e){}
}
// ---------- Save all ----------
async function saveAll(){
  var payload = {
    name: $('name').value.trim(),
    linkedin: normalizeUrl($('linkedin').value.trim()),
    landing: normalizeUrl($('landing').value.trim()),
    landingLabel: $('landingLabel').value.trim(),
    scheduleUrl: normalizeUrl($('scheduleUrl').value.trim()),
    companyUrl: normalizeUrl($('companyUrl').value.trim())
  };
  ['linkedin','landing','scheduleUrl','companyUrl'].forEach(function(id){ $(id).value = payload[id]; });
  try {
    await api('/api/config', payload);
    var c = await api('/api/config'); backupLocal(c);
    out('outBasic', 'Saved ✓ — the R1 will auto-sync within ~20s.');
  } catch(e){ out('outBasic', 'Error: '+e.message, 1); }
}
// ---------- Sync (pull from server, confirm on phone) ----------
async function syncPhone(){
  try {
    var c = await api('/api/config');
    backupLocal(c);
    ['name','linkedin','landing','landingLabel','scheduleUrl','companyUrl'].forEach(function(k){ if(c[k]) $(k).value = c[k]; });
    if ((c.sessions||[]).length) preview(c.sessions);
    out('outBasic', 'Synced ✓ from server — ' + (c.sessions||[]).length + ' sessions, rev ' + (c.rev||0) + '.');
  } catch(e){ out('outBasic', 'Error: '+e.message, 1); }
}
function preview(ss){
  var shown = ss.slice(0,6), rest = ss.length - shown.length;
  var html = shown.map(function(s){
    return '<div class="sess"><b>'+s.time+'</b> '+s.title+(s.speaker?' — <i>'+s.speaker+'</i>':'')+'</div>';
  }).join('');
  if (rest > 0) html += '<div class="sess" id="moreSess" onclick="showAll()" style="color:#f60;cursor:pointer">▸ show '+rest+' more</div>';
  else html += '<div class="sess" style="color:#666" onclick="hideAll()">▴ collapse</div>';
  $('sessPreview').innerHTML = html;
}
function showAll(){
  api('/api/config').then(function(c){
    if ((c.sessions||[]).length) preview(c.sessions, true);
  });
}
function preview(ss, all){
  all = !!all;
  var shown = all ? ss.slice(0,50) : ss.slice(0,6), rest = ss.length - shown.length;
  var html = shown.map(function(s){
    return '<div class="sess"><b>'+s.time+'</b> '+s.title+(s.speaker?' — <i>'+s.speaker+'</i>':'')+'</div>';
  }).join('');
  if (!all && rest > 0) html += '<div class="sess" style="color:#f60;cursor:pointer" onclick="showAll()">▸ show '+rest+' more</div>';
  else if (all) html += '<div class="sess" style="color:#666;cursor:pointer" onclick="preview([])">▴ collapse</div>';
  $('sessPreview').innerHTML = html;
}
function hideAll(){ preview([]); }
async function importSchedule(){
  var u = normalizeUrl($('scheduleUrl').value.trim());
  $('scheduleUrl').value = u;
  if (!u) return out('outSched','Enter a URL',1);
  $('btnSched').disabled = true; out('outSched','Fetching + parsing…');
  try {
    var j = await api('/api/schedule', { url:u });
    if (j.sessions.length){ out('outSched', j.sessions.length + ' sessions extracted ✓ — R1 will auto-sync.'); preview(j.sessions);
      var c = await api('/api/config'); backupLocal(c); }
    else out('outSched', 'No time-pattern sessions found on that page. Try the printable/simple agenda URL.', 1);
  } catch(e){ out('outSched','Error: '+e.message,1); }
  $('btnSched').disabled = false;
}
async function scanCompany(){
  var u = normalizeUrl($('companyUrl').value.trim());
  $('companyUrl').value = u;
  if (!u) return out('outCo','Enter a URL',1);
  $('btnCo').disabled = true; out('outCo','Scanning…');
  try {
    var j = await api('/api/extract', { url:u, save:'company' });
    out('outCo', 'Saved ✓ ('+j.text.length+' chars). Preview:\\n' + j.text.slice(0,300) + '…');
    var c = await api('/api/config'); backupLocal(c);
  } catch(e){ out('outCo','Error: '+e.message,1); }
  $('btnCo').disabled = false;
}
load();
</script>
</body>
</html>
